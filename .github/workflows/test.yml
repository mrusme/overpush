name: Test

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Build
      run: go build ./...

    - name: Test
      run: go test -vet=off -race ./...

  vet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'

    - name: Vet against baseline
      run: |
        (go vet ./... 2>&1 || true) \
          | (grep -vE '^#' || true) \
          | sed -E 's/:[0-9]+:[0-9]+:/:/' \
          | sort > /tmp/vet-current.txt
        diff -u .github/vet-baseline.txt /tmp/vet-current.txt
